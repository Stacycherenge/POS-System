name: POS Backend CI Test Runner

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'backend/projects/pos/requirements.txt'

    - name: Install Application Dependencies
      defaults:
        run:
          working-directory: backend/projects/pos
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Execute Complete Test Suite with Pytest
      defaults:
        run:
          working-directory: backend/projects/pos
      env:
        DATABASE_URL: "sqlite:///:memory:" 
      run: |
        pytest -v
