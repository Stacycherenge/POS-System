name: POS Backend CI Test Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pydantic python-multipart passlib bcrypt python-jose[cryptography] httpx pytest pytest-asyncio
          
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          elif [ -f backend/projects/pos/requirements.txt ]; then 
            pip install -r backend/projects/pos/requirements.txt
          fi

      - name: Run automated test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONPATH: .
        run: |
          python -m pytest -v
