name: POS Backend CI Test Runner

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Application Dependencies
      defaults:
        run:
          working-directory: backend/projects/pos
      run: |
        python -m pip install --upgrade pip
        python -m pip install fastapi uvicorn sqlalchemy pydantic python-multipart passlib bcrypt python-jose[cryptography] httpx pytest pytest-asyncio
        
        if [ -f requirements.txt ]; then 
          python -m pip install -r requirements.txt
        elif [ -f ../requirements.txt ]; then 
          python -m pip install -r ../requirements.txt
        elif [ -f ../../../requirements.txt ]; then 
          python -m pip install -r ../../../requirements.txt
        fi

    - name: Execute Complete Test Suite with Pytest
      defaults:
        run:
          working-directory: backend/projects/pos
      env:
        DATABASE_URL: "sqlite:///:memory:" 
        PYTHONPATH: .
      run: |
        python -m pytest -v
